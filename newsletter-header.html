<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finsai Trade Newsletter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Newsletter Header */
    .newsletter-header {
      background-color: #000000;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .newsletter-header .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* SVG Logo Icon */
    .logo-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    /* Brand name text */
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #7ec8e3 0%, #4a90d9 50%, #3a5fa0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
    }

    .brand-tagline {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 8px;
      color: #7ec8e3;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Email-safe fallback table layout (for email clients) */
    .email-safe-header {
      display: none;
    }

    /* Preview banner below header */
    .newsletter-body {
      background-color: #ffffff;
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 40px;
      border-top: 3px solid #4a90d9;
    }

    .newsletter-body p {
      color: #444;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- ===== NEWSLETTER HEADER ===== -->
  <header class="newsletter-header">
    <div class="logo-wrapper">

      <!-- Finsai Trade SVG Logo Icon (F-shaped lightning bolt mark) -->
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Finsai Trade Logo">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7ec8e3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3a5fa0;stop-opacity:1" />
          </linearGradient>
        </defs>
        <!-- Top bar -->
        <rect x="20" y="12" width="60" height="14" rx="4" fill="url(#grad1)" />
        <!-- Middle bar (shorter, offset right) -->
        <rect x="30" y="43" width="45" height="14" rx="4" fill="url(#grad1)" />
        <!-- Bottom bar -->
        <rect x="20" y="74" width="60" height="14" rx="4" fill="url(#grad1)" />
        <!-- Vertical connector -->
        <rect x="20" y="12" width="14" height="76" rx="4" fill="url(#grad1)" />
      </svg>

      <!-- Brand name -->
      <div class="brand-text">
        <span class="brand-name">Finsai</span>
        <span class="brand-tagline">Trade</span>
      </div>

    </div>
  </header>
  <!-- ===== END NEWSLETTER HEADER ===== -->

  <!-- Sample newsletter body (placeholder) -->
  <div class="newsletter-body">
    <p>Welcome to the latest edition of the <strong>Finsai Trade</strong> newsletter. Stay informed with the latest market insights, trading strategies, and platform updates.</p>
  </div>

</body>
</html>
